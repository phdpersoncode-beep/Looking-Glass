<!doctype html><html><head><meta charset="utf-8"><style>body{font:16px/1.7 system-ui;background:#f8f5ff;color:#30213e;padding:45px}h1{font:38px Georgia}button{padding:10px 16px;background:#983dec;color:white;border:0;border-radius:6px}.card{padding:22px;background:white;border-radius:10px;margin:20px 0}code{color:#8934d4}</style></head><body><p>LOOKING GLASS · EXAMPLE REPORT</p><h1>A report with a working interaction.</h1><div class="card"><p>This HTML document runs in an isolated preview.</p><button id="counter">Run check</button><p id="result">No checks run yet.</p></div><div class="card"><h2>Review notes</h2><p>Switch to HTML source to edit or discuss a passage.</p><p id="isolation">Checking isolation…</p></div><script>let count=0;document.getElementById('counter').onclick=()=>{document.getElementById('result').textContent='Checks run: '+(++count)};try{parent.document.body;document.getElementById('isolation').textContent='ERROR: parent readable'}catch(e){document.getElementById('isolation').textContent='Parent application state is isolated.'}</script></body></html>
