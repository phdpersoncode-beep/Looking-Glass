name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    concurrency:
      group: fast-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: npm ci
      - run: npm test
      - run: uv run pytest -m 'not browser' -q
      - run: uv run python scripts/verify_browser_shards.py 4
      - run: npm run build
      - run: git diff --exit-code -- looking_glass/static
      - run: uv build
  browser:
    # Only an explicit final-test request starts the full browser collection.
    # Keeping the label on a PR does not rerun browsers on later pushes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'run-browser-tests')
    concurrency:
      group: browser-${{ github.workflow }}-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium firefox
      - run: uv run pytest -m browser --browser-shard=${{ matrix.shard }}/4 -q --durations=10
        env:
          LOOKING_GLASS_BROWSER: installed
