name: HTML reading diagnostics
on:
  push:
    branches: [test/html-reading-diagnostics]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run playwright install --with-deps firefox
      - run: uv run pytest tests/_diagnostic_reading.py -q -s
        env:
          LOOKING_GLASS_BROWSER: installed
