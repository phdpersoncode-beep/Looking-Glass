name: PR24 Firefox diagnostics
on:
  push:
    branches: [feature/explorer-creation-zen-image-drafts]
    paths: [.github/workflows/pr24-diagnostics.yml]
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run playwright install --with-deps firefox
      - run: uv run pytest tests/test_coding_support_browser.py -k 'f12_current_buffer and firefox' -q -s
        env:
          LOOKING_GLASS_BROWSER: installed
