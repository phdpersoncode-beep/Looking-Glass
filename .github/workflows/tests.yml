name: Regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: npm ci
      - run: npm test
      - run: uv run pytest -m 'not browser' -q
      - run: npm run build
      - run: git diff --exit-code -- looking_glass/static
      - run: uv build
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium firefox
      - run: uv run pytest -m browser -q
        env:
          LOOKING_GLASS_BROWSER: installed
